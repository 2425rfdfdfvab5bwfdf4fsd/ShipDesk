[build]
builder = "nixpacks"
buildCommand = "npm install && cd server && npx prisma generate && npx prisma migrate deploy && npm run build"

[deploy]
startCommand = "cd server && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
NODE_ENV = "production"
