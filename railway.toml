[build]
builder = "nixpacks"
buildCommand = "npm install --include=dev && cd server && npx prisma generate && npm run build"

[deploy]
startCommand = "cd server && npx prisma migrate deploy 2>/dev/null || true && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
