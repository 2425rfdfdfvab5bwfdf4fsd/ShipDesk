[build]
builder = "nixpacks"
buildCommand = "npm install --include=dev && npm run build --workspace=server && node_modules/.bin/prisma migrate deploy --schema=server/prisma/schema.prisma"

[deploy]
startCommand = "cd server && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
